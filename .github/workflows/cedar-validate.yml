name: cedar validate

# Cedar drops a policy that errors at evaluation time (e.g. a context
# attribute typo'd in a `when` clause) instead of aborting - it keeps
# evaluating with whatever policies are left, so a broken `forbid` can be
# silently skipped and a `permit` can win by default. `cedar validate`
# checks every policy against a schema of the real request shape, so a
# typo like this is caught here instead of failing open in production.
# See src/policies/budget.cedarschema and the note atop src/authorize.py.

on:
  push:
    paths:
      - "src/policies/**"
      - ".github/workflows/cedar-validate.yml"
  pull_request:
    paths:
      - "src/policies/**"
      - ".github/workflows/cedar-validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cedar CLI
        run: cargo install cedar-policy-cli --version 4.12.0 --locked

      - name: cedar validate
        run: |
          cedar validate \
            --schema src/policies/budget.cedarschema \
            --policies src/policies/budget.cedar
